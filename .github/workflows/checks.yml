name: Checks
on: [push, pull_request]
permissions:
  contents: read

jobs:
  correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4
        with:
          repository: SAIRcompetition/Andrews-Curtis
          ref: a0fd6e6f52d82c93ccc06ab91d81e8fa3678256e
          path: .official
      - name: Build and check C++ tools
        run: make check
      - name: Install shortcut package
        run: python -m pip install ./shortcut-search
      - name: Check native kernels and shortcut search
        env:
          ACC_OFFICIAL_TOOLS: ${{ github.workspace }}/.official/competition/tools
        run: |
          python -c 'from ac_shortcuts.native import BACKEND; assert BACKEND == "native", BACKEND'
          python -m unittest discover -s shortcut-search/tests -v
      - name: Check Python fallback
        env:
          ACC_OFFICIAL_TOOLS: ${{ github.workspace }}/.official/competition/tools
          AC_SHORTCUTS_PURE_PYTHON: '1'
        run: python -m unittest discover -s shortcut-search/tests -v
